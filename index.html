<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abecedario Interactivo</title>
    <!-- Bootstrap CDN existente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles/index.css">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- RF-01: Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Abecedario Interactivo</a>
        </div>
    </nav>

    <!-- Encabezado / Introducción -->
    <header class="container text-center my-4">
        <h1 class="fw-bold">Galería de Letras</h1>
        <p class="text-muted">Explora cada letra del abecedario</p>
    </header>

    <!-- RF-02: Galería de letras (26 en total organizadas en grid) -->
    <main class="container mb-5 flex-grow-1">
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3 justify-content-center"
            id="galeria-letras">
            <!-- A -->
            <div class="col">
                <div class="card h-100 text-center shadow-sm letter-card" data-letter="A">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-3">
                        <h2 class="card-title display-5 fw-bold mb-1">A</h2>
                        <p class="card-text text-muted mb-0">a</p>
                    </div>
                </div>
            </div>
            <!-- B -->
            <div class="col">
                <div class="card h-100 text-center shadow-sm letter-card" data-letter="B">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-3">
                        <h2 class="card-title display-5 fw-bold mb-1">B</h2>
                        <p class="card-text text-muted mb-0">b</p>
                    </div>
                </div>
            </div>
            <!-- C -->
            <div class="col">
                <div class="card h-100 text-center shadow-sm letter-card" data-letter="C">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-3">
                        <h2 class="card-title display-5 fw-bold mb-1">C</h2>
                        <p class="card-text text-muted mb-0">c</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- RF-06: Sección del equipo -->
    <footer class="bg-white border-top py-5 mt-auto" id="seccion-equipo">
        <div class="container">
            <div class="text-center mb-4">
                <h2 class="h3 fw-bold mb-1">Equipo de Rescate</h2>
                <p class="text-muted">Integrantes del proyecto</p>
            </div>
            <div
                class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-3 text-center justify-content-center">
                <div class="col">
                    <div class="card h-100 border shadow-sm p-3 rounded-3">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                            <span
                                class="badge bg-primary-subtle text-primary rounded-pill mb-2 px-3 py-1">Integrante</span>
                            <h3 class="h6 fw-bold mb-0">Jessica Manturano</h3>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 border shadow-sm p-3 rounded-3">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                            <span
                                class="badge bg-primary-subtle text-primary rounded-pill mb-2 px-3 py-1">Integrante</span>
                            <h3 class="h6 fw-bold mb-0">Carolayn Mora</h3>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 border shadow-sm p-3 rounded-3">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                            <img src="./assets/integrantes/julian_avatar.png" alt="Julian Lozano"
                                class="rounded-circle mb-2 shadow-sm" width="80" height="80"
                                style="object-fit: cover;">
                            <span
                                class="badge bg-primary-subtle text-primary rounded-pill mb-2 px-3 py-1">Integrante</span>
                            <h3 class="h6 fw-bold mb-0">Julian Lozano</h3>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 border shadow-sm p-3 rounded-3">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                            <span
                                class="badge bg-primary-subtle text-primary rounded-pill mb-2 px-3 py-1">Integrante</span>
                            <h3 class="h6 fw-bold mb-0">Diana Hinestroza</h3>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 border shadow-sm p-3 rounded-3">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-2">
                            <span
                                class="badge bg-primary-subtle text-primary rounded-pill mb-2 px-3 py-1">Integrante</span>
                            <h3 class="h6 fw-bold mb-0">Cristian Rojas</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts de Bootstrap existentes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Lógica de interacción -->
    <script src="script.js"></script>
</body>

</html>
