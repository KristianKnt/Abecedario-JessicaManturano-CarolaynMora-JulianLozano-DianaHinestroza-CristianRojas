<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abecedario Interactivo</title>
    <!-- Bootstrap CDN existente -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles/index.css" />
  </head>

  <body class="bg-light min-vh-100 d-flex flex-column">
    <!-- RF-01: Barra de navegación -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Abecedario Interactivo</a>
      </div>
    </nav>

    <!-- Encabezado / Introducción -->
    <header class="container text-center my-4">
      <h1 class="fw-bold">Galería de Letras</h1>
      <p class="text-muted">Explora cada letra del abecedario</p>
    </header>

    <!-- RF-02: Galería de letras (26 en total organizadas en grid) -->
    <main class="container mb-5 flex-grow-1">
      <alphabet-component></alphabet-component>
    </main>

    <!-- RF-06: Sección del equipo -->
    <footer-component></footer-component>
    
     <script src="./scripts/letter-component.js" defer></script>
    <script src="./scripts/alphabet-component.js" defer></script>
    <script src="./scripts/footer-component.js" defer></script>

    <!-- Scripts de Bootstrap existentes -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Lógica de interacción -->
    <script src="script.js"></script>
  </body>
</html>
